name: Build Fiq-FinTrack APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Paketkan File Web ke Wadah WebView
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          rsync -av --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='www' ./ www/
          npx cap init "Fiq-FinTrack" "com.fiq.fintrack" --web-dir www
          npx cap add android

      - name: Kompilasi APK (Assemble Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Unggah Hasil APK ke GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fiq-FinTrack-Release
          path: android/app/build/outputs/apk/debug/app-debug.apk
