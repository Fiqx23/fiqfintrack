name: Build Fiq-FinTrack APK

on:
  workflow_dispatch:

# Build only reads repository contents; no write permissions or secrets are needed.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Paketkan Aset Offline ke Wadah WebView
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share @capacitor/assets sharp esbuild tailwindcss@3.4.17 chart.js@4 @supabase/supabase-js@2
          mkdir -p www assets www/vendor
          rsync -av --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='www' --exclude='assets' ./ www/

          # Build Tailwind locally for the packaged APK only.
          cat > tailwind.config.cjs <<'EOF'
          module.exports = {
            content: ['./www/index.html'],
            darkMode: 'class',
            theme: {
              extend: {
                fontFamily: {
                  sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                },
                colors: {
                  primary: {
                    50: '#eef2ff',
                    100: '#e0e7ff',
                    500: '#6366f1',
                    600: '#4f46e5',
                    700: '#4338ca',
                  },
                },
              },
            },
          };
          EOF
          cat > tailwind.input.css <<'EOF'
          @tailwind base;
          @tailwind components;
          @tailwind utilities;
          EOF
          npx tailwindcss -c ./tailwind.config.cjs -i ./tailwind.input.css -o ./www/tailwind.css --minify

          # Bundle browser libraries locally so first launch does not need a CDN.
          cp node_modules/chart.js/dist/chart.umd.js www/vendor/chart.umd.js
          test -f node_modules/@supabase/supabase-js/dist/umd/supabase.js
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/vendor/supabase.js

          # Build APK-only native export bridge. The repository index.html stays untouched.
          cat > apk-native-export.js <<'EOF'
          import { registerPlugin } from '@capacitor/core';

          const FinTrackFile = registerPlugin('FinTrackFile');

          window.FinTrackNativeExport = {
            async saveFile(content, fileName, mimeType) {
              const result = await FinTrackFile.saveFile({ content, fileName, mimeType });
              if (result && result.cancelled) return { saved: false, cancelled: true };
              if (!result || !result.saved || !result.uri) {
                throw new Error('Android tidak mengonfirmasi penyimpanan file.');
              }
              return { saved: true, uri: result.uri };
            },
          };
          EOF
          npx esbuild apk-native-export.js --bundle --format=iife --platform=browser --target=es2020 --outfile=www/vendor/apk-native-export.js

          # Patch only the APK copy. The repository index.html remains unchanged for GitHub Pages.
          node <<'NODE'
          const fs = require('fs');
          const path = 'www/index.html';
          let html = fs.readFileSync(path, 'utf8');

          const startMarker = '  <!-- Tailwind CSS CDN -->';
          const endMarker = '  <!-- Google Font: Plus Jakarta Sans -->';
          const start = html.indexOf(startMarker);
          const end = html.indexOf(endMarker, start);
          if (start === -1 || end === -1 || end <= start) {
            throw new Error('Blok CDN yang diharapkan tidak ditemukan. APK build dihentikan agar HTML tidak dipatch secara keliru.');
          }

          const localAssets = [
            '  <!-- Tailwind CSS compiled locally for offline APK -->',
            '  <link rel="stylesheet" href="./tailwind.css">',
            '  <!-- Chart.js bundled locally for offline APK -->',
            '  <script src="./vendor/chart.umd.js"></script>',
            '  <!-- Supabase JS bundled locally for offline SDK initialization -->',
            '  <script src="./vendor/supabase.js"></script>',
            '  <!-- APK-only native JSON backup bridge -->',
            '  <script src="./vendor/apk-native-export.js"></script>',
            '',
          ].join('\n');

          html = html.slice(0, start) + localAssets + html.slice(end);

          // Remove Google Fonts network requests from the APK copy; CSS falls back to system sans-serif offline.
          html = html.replace('  <link rel="preconnect" href="https://fonts.googleapis.com">\n', '');
          html = html.replace('  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n', '');
          html = html.replace('  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">\n', '');

          const nativeExportPatch = "<!-- APK_NATIVE_EXPORT_PATCH -->\n<script>\n(() => {\n  const isNativeAndroid = () => Boolean(window.Capacitor && typeof window.Capacitor.getPlatform === 'function' && window.Capacitor.getPlatform() === 'android');\n  const originalCsvExport = window.exportTransactionsToCSV;\n  const originalJsonBackup = window.backupTransactionsJSON;\n\n  window.backupTransactionsJSON = async function() {\n    if (!isNativeAndroid()) return originalJsonBackup.apply(this, arguments);\n    try {\n      if (!window.FinTrackNativeExport) throw new Error('Modul ekspor native tidak tersedia.');\n      const payload = {\n        app: 'Fiq-FinTrack Pro',\n        version: '3.2',\n        schemaVersion: 2,\n        deviceId: getDeviceId(),\n        exportedAt: new Date().toISOString(),\n        transactions: transactions,\n        wallets: customWallets,\n        categories: customCategories,\n        startingBalances: startingBalances,\n        budgets: budgets,\n        debts: debts,\n        goals: goals,\n        presets: presets\n      };\n      const json = JSON.stringify(payload, null, 2);\n      const fileName = 'FinTrack_Full_Backup_' + new Date().toISOString().slice(0, 10) + '.json';\n      const result = await window.FinTrackNativeExport.saveFile(json, fileName, 'application/json');\n      if (result.saved) showToast('Backup JSON tersimpan di lokasi yang dipilih. Simpan lokasi file untuk pemulihan nanti.', 'success');\n      else if (result.cancelled) showToast('Penyimpanan backup dibatalkan. File belum disimpan.', 'warning');\n    } catch (error) {\n      console.error('[FinTrack Export] JSON backup gagal:', error);\n      showToast('Backup JSON gagal. Coba lagi dan periksa penyimpanan perangkat.', 'danger');\n    }\n  };\n})();\n</script>";
          if (!html.includes('function backupTransactionsJSON()')) {
            throw new Error('Fungsi ekspor yang diharapkan tidak ditemukan; APK build dihentikan agar patch tidak diterapkan ke kode yang berbeda.');
          }
          if (html.includes('<!-- APK_NATIVE_EXPORT_PATCH -->')) {
            throw new Error('Patch ekspor native sudah ada di sumber APK; hentikan build untuk mencegah injeksi ganda.');
          }
          if (!html.includes('</body>')) throw new Error('Tag penutup body tidak ditemukan untuk patch ekspor native.');
          html = html.replace('</body>', nativeExportPatch + '\n</body>');
          const forbidden = [
            'https://cdn.tailwindcss.com',
            'https://cdn.jsdelivr.net/npm/chart.js',
            'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
            'https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans',
          ];
          for (const url of forbidden) {
            if (html.includes(url)) throw new Error('Ketergantungan CDN masih tersisa di APK: ' + url);
          }
          for (const file of ['www/tailwind.css', 'www/vendor/chart.umd.js', 'www/vendor/supabase.js', 'www/vendor/apk-native-export.js']) {
            if (!fs.existsSync(file) || fs.statSync(file).size === 0) {
              throw new Error('Aset offline tidak ditemukan atau kosong: ' + file);
            }
          }
          fs.writeFileSync(path, html);
          console.log('Aset offline APK siap; sumber index.html repository tidak diubah.');
          NODE

          node -e "require('sharp')('icon-512.png').resize(1024, 1024).png().toFile('assets/icon.png').then(() => console.log('Sumber ikon Android dibuat dari icon-512.png'))"
          npx cap init "Fiq-FinTrack" "com.fiq.fintrack" --web-dir www
          npx cap add android

          # Android Storage Access Framework: save exports to a user-selected document location.
          mkdir -p android/app/src/main/java/com/fiq/fintrack
          cat > android/app/src/main/java/com/fiq/fintrack/FinTrackFilePlugin.java <<'EOF'
          package com.fiq.fintrack;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;

          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          @CapacitorPlugin(name = "FinTrackFile")
          public class FinTrackFilePlugin extends Plugin {
            @PluginMethod
            public void saveFile(PluginCall call) {
              String fileName = call.getString("fileName");
              String mimeType = call.getString("mimeType");
              String fileContent = call.getString("content");
              if (fileName == null || fileName.trim().isEmpty() || fileContent == null) {
                call.reject("Nama file atau isi file tidak tersedia.");
                return;
              }
              if (mimeType == null || mimeType.trim().isEmpty()) mimeType = "application/octet-stream";

              Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
              intent.addCategory(Intent.CATEGORY_OPENABLE);
              intent.setType(mimeType);
              intent.putExtra(Intent.EXTRA_TITLE, fileName);
              call.getData().put("finTrackExportContent", fileContent);
              startActivityForResult(call, intent, "handleSaveResult");
            }

            @ActivityCallback
            private void handleSaveResult(PluginCall call, ActivityResult result) {
              if (call == null) return;
              if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null ||
                  result.getData().getData() == null) {
                JSObject cancelled = new JSObject();
                cancelled.put("saved", false);
                cancelled.put("cancelled", true);
                call.resolve(cancelled);
                return;
              }

              Uri uri = result.getData().getData();
              String fileContent = call.getData().getString("finTrackExportContent");
              if (fileContent == null) {
                call.reject("Isi file ekspor tidak tersedia setelah dialog penyimpanan.");
                return;
              }
              try (OutputStream output = getContext().getContentResolver().openOutputStream(uri, "w")) {
                if (output == null) throw new IllegalStateException("Android tidak dapat membuka file tujuan.");
                output.write(fileContent.getBytes(StandardCharsets.UTF_8));
                output.flush();
                JSObject saved = new JSObject();
                saved.put("saved", true);
                saved.put("uri", uri.toString());
                call.resolve(saved);
              } catch (Exception error) {
                call.reject("Gagal menyimpan file ke lokasi yang dipilih.", error);
              }
            }
          }
          EOF

          cat > android/app/src/main/java/com/fiq/fintrack/MainActivity.java <<'EOF'
          package com.fiq.fintrack;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(FinTrackFilePlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF

          npx cap sync android
          npx capacitor-assets generate --android --iconBackgroundColor '#4f46e5' --splashBackgroundColor '#f8fafc'
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7' }" >> android/app/build.gradle
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> android/app/build.gradle

      - name: Kompilasi APK (Assemble Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Unggah Hasil APK ke GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fiq-FinTrack-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
