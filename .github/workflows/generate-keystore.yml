name: Generate Permanent Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Buat Berkas Keystore Resmi
        run: |
          # Membuat keystore dengan masa berlaku 25 tahun (10.000 hari)
          keytool -genkeypair -v \
            -keystore fintrack-release.keystore \
            -alias fintrack \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "fintrackrahasia2026" \
            -keypass "fintrackrahasia2026" \
            -dname "CN=Fiq-FinTrack, OU=Finance, O=Fiq, L=Makassar, ST=Sulsel, C=ID"

          # Mengonversi berkas biner ke teks Base64
          base64 -w 0 fintrack-release.keystore > keystore_base64.txt

          # Kumpulkan ke dalam folder artefak
          mkdir -p output_keystore
          mv fintrack-release.keystore output_keystore/
          mv keystore_base64.txt output_keystore/

      - name: Unggah Paket Keystore ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kunci-Permanen-Fiq-FinTrack
          path: output_keystore/
